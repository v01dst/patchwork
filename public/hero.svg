<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Background Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#4f46e5" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="220" fill="#9333ea" opacity="0.12" filter="url(#glow)" />

  <!-- Grid lines overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon -->
    <rect width="48" height="48" rx="12" fill="url(#accentGrad)" />
    <path d="M14 24L24 14L34 24L24 34Z" fill="white" />
    
    <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">PATCHWORK</text>
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Developer Project Dashboard &amp; Kanban Engine</text>

    <!-- Badge Pills -->
    <g transform="translate(0, 110)">
      <rect width="130" height="28" rx="14" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
      <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">NEXT.JS 15</text>

      <rect x="140" width="130" height="28" rx="14" fill="#064e3b" stroke="#047857" stroke-width="1"/>
      <text x="205" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">SUPABASE RLS</text>

      <rect x="280" width="130" height="28" rx="14" fill="#581c87" stroke="#7e22ce" stroke-width="1"/>
      <text x="345" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">@DND-KIT</text>
    </g>
  </g>

  <!-- Mockup Kanban Board Preview -->
  <g transform="translate(80, 260)">
    <!-- Column 1: Todo -->
    <g transform="translate(0, 0)">
      <rect width="320" height="310" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="25" cy="28" r="5" fill="#3b82f6" />
      <text x="40" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Todo</text>
      <rect x="270" y="18" width="28" height="20" rx="10" fill="#334155" />
      <text x="284" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">2</text>

      <!-- Task Card 1 -->
      <g transform="translate(15, 55)">
        <rect width="290" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <rect x="15" y="14" width="55" height="18" rx="6" fill="#dc2626" opacity="0.2" stroke="#dc2626" stroke-width="1"/>
        <text x="42" y="27" font-family="sans-serif" font-size="10" font-weight="800" fill="#f87171" text-anchor="middle">URGENT</text>
        <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Implement OAuth2 Token Sync</text>
        <text x="15" y="90" font-family="monospace" font-size="10" fill="#818cf8">#auth #api</text>
        <text x="210" y="90" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444">⚠ Aug 30</text>
      </g>

      <!-- Task Card 2 -->
      <g transform="translate(15, 180)">
        <rect width="290" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <rect x="15" y="14" width="55" height="18" rx="6" fill="#2563eb" opacity="0.2" stroke="#2563eb" stroke-width="1"/>
        <text x="42" y="27" font-family="sans-serif" font-size="10" font-weight="800" fill="#60a5fa" text-anchor="middle">MEDIUM</text>
        <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Dark Mode Tailwind Token Map</text>
        <text x="15" y="90" font-family="monospace" font-size="10" fill="#818cf8">#ui #tailwind</text>
      </g>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(360, 0)">
      <rect width="320" height="310" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" />
      <circle cx="25" cy="28" r="5" fill="#f59e0b" />
      <text x="40" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">In Progress</text>
      <rect x="270" y="18" width="28" height="20" rx="10" fill="#334155" />
      <text x="284" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">1</text>

      <!-- Active Dragged Card -->
      <g transform="translate(15, 55)">
        <rect width="290" height="120" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
        <rect x="15" y="14" width="45" height="18" rx="6" fill="#ea580c" opacity="0.2" stroke="#ea580c" stroke-width="1"/>
        <text x="37" y="27" font-family="sans-serif" font-size="10" font-weight="800" fill="#fb923c" text-anchor="middle">HIGH</text>
        <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Server-Side Audit Logging</text>
        <text x="15" y="75" font-family="sans-serif" font-size="11" fill="#c7d2fe">Transactional mutations...</text>
        <text x="15" y="100" font-family="monospace" font-size="10" fill="#a5b4fc">#backend #audit</text>
      </g>
    </g>

    <!-- Column 3: Done -->
    <g transform="translate(720, 0)">
      <rect width="320" height="310" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="25" cy="28" r="5" fill="#10b981" />
      <text x="40" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Done</text>
      <rect x="270" y="18" width="28" height="20" rx="10" fill="#334155" />
      <text x="284" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">3</text>

      <!-- Task Card Done -->
      <g transform="translate(15, 55)">
        <rect width="290" height="95" rx="12" fill="#1e293b" opacity="0.75" stroke="#334155" stroke-width="1" />
        <rect x="15" y="14" width="40" height="18" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
        <text x="35" y="27" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">LOW</text>
        <text x="15" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-decoration="line-through">PostgreSQL Supabase Migrations</text>
        <text x="15" y="80" font-family="monospace" font-size="10" fill="#64748b">#database</text>
      </g>
    </g>
  </g>
</svg>
